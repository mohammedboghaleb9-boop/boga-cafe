name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # the real site ships no demo: no admin password, example customers or DÉMO payment details
      - run: npm run check:real-build
      - run: npm run build:functions
      - run: npm run build:demo
      # the live-database build: needs its public values and ships no example catalog
      - run: npx vite build --outDir dist-supabase
        env:
          VITE_DATA_MODE: supabase
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          # Cloudflare's Turnstile test key that always passes (the real one comes in slice 11)
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - run: "! grep -l boga-signature dist-supabase/assets/*.js"
      # its Admin Panel signs in with Supabase Auth: the prototype's public password never ships
      - run: "! grep -l boga2026 dist-supabase/assets/*.js"

  # the site in a browser (real settings, demo data): shop, checkout, admin roles, phone widths, axe;
  # and the live-site build's Turnstile forms against a Supabase and a widget the tests answer
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      # pgTAP for supabase/tests/aal.sql, installed in the database container (its image carries the PostgreSQL apt repository)
      - run: docker exec ${{ job.services.postgres.id }} sh -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-pgtap'
      - run: ./supabase/tests/run-local.sh
