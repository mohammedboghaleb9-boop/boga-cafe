name: CI

on:
  push:
  pull_request:

# Every job has its own limit (about twice its slowest successful run in the last 40: web 5.5 min, e2e 12.3 min,
# database 1.8 min): without one, GitHub waits 6 hours, and a job stuck in `playwright install` held a run
# for over an hour on 2026-10-22. A job past its limit is cancelled, which is not a pass.
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # the real site ships no demo: no admin password, example customers or DÉMO payment details
      - run: npm run check:real-build
      - run: npm run build:functions
      - run: npm run build:demo
      # the live-database build: needs its public values and ships no example catalog
      - run: npx vite build --outDir dist-supabase
        env:
          VITE_DATA_MODE: supabase
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          # Cloudflare's Turnstile test key that always passes (CI only; the real site key is in .env.workers-preview)
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      # ls first: a glob that matches nothing would let the grep pass
      - run: "ls dist-supabase/assets/*.js > /dev/null && ! grep -l boga-signature dist-supabase/assets/*.js"
      # its Admin Panel signs in with Supabase Auth: the prototype's public password never ships
      - run: "ls dist-supabase/assets/*.js > /dev/null && ! grep -l boga2026 dist-supabase/assets/*.js"

  # the site in a browser (real settings, demo data): shop, checkout, admin roles, phone widths, axe;
  # and the live-site build's Turnstile forms against a Supabase and a widget the tests answer
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e
      - run: npm run test:e2e
      # the "coming soon" files the browser tests used (dist-coming-soon, checked by its own build; production's
      # fallback since the live shop, scripts/build-target.mjs PRODUCTION_SITE): the default command must rebuild them byte for byte (every file and its SHA-256, the list included),
      # then they go up with their sums and pictures for the owner's review. No deploy, no secret in them.
      - name: 'coming soon (the fallback page): the default command rebuilds the tested files byte for byte'
        run: |
          set -o pipefail
          npm run build -- --outDir dist-coming-soon-rebuilt
          sums() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -r0 sha256sum); }
          sums dist-coming-soon > coming-soon-SHA256SUMS
          grep -q ' \./index\.html$' coming-soon-SHA256SUMS
          test "$(ls coming-soon-review/*.png | wc -l)" = 3
          sums dist-coming-soon-rebuilt | diff -u coming-soon-SHA256SUMS -
      - uses: actions/upload-artifact@v7
        with:
          name: coming-soon-${{ github.sha }}
          path: |
            dist-coming-soon/
            coming-soon-SHA256SUMS
            coming-soon-review/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    # The runner's own PostgreSQL 16, no image to pull: Docker Hub's anonymous limit (2026-10-09)
    # and then AWS's public mirror ("toomanyrequests: Data limit exceeded", 2026-10-17) failed this
    # job before any test ran. ubuntu-24.04 ships PostgreSQL 16, its service off by default.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Start PostgreSQL and wait until it accepts connections (60 s at most)
        run: |
          sudo systemctl start postgresql.service
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -q; do sleep 1; done'
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "alter user postgres password 'postgres'"
      # its encoding too: the suites hold non-ASCII text, which a SQL_ASCII cluster refuses
      - name: The server is PostgreSQL 16 in UTF8 (its own version, not psql's)
        run: |
          psql -v ON_ERROR_STOP=1 -tA -c 'select version()'
          V=$(psql -v ON_ERROR_STOP=1 -tA -c 'show server_version_num')
          E=$(psql -v ON_ERROR_STOP=1 -tA -c 'show server_encoding')
          echo "server_version_num=$V server_encoding=$E"
          [ "$((V / 10000))" = 16 ] || { echo "expected PostgreSQL 16, the server is $V"; exit 1; }
          [ "$E" = UTF8 ] || { echo "expected a UTF8 cluster, the server is $E"; exit 1; }
      # pgTAP for the pgTAP suites of run-local.sh: this exact version, or the job stops
      - name: Install pgTAP 1.3.2-2 and check the server offers it
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16-pgtap=1.3.2-2
          A=$(psql -v ON_ERROR_STOP=1 -tA -c "select default_version from pg_available_extensions where name = 'pgtap'")
          echo "pgtap available: ${A:-none}"
          [ "$A" = 1.3.2 ] || { echo "the server does not offer pgtap 1.3.2"; exit 1; }
      - run: ./supabase/tests/run-local.sh
